# What qmllint can judge outside the shell, and what it cannot.
#
# The window's types come from omarchy-shell (`qs.Commons`, `qs.Ui`) and from
# Quickshell. Neither is installed where this lint runs: CI is an Arch
# container with qt6-declarative and nothing else, and a checkout on a machine
# without the shell is the same. That splits qmllint's categories in two, and
# this file is the split.
#
# **Errors.** Everything below at `error` is a finding the missing modules
# cannot explain: a shadowed member, a duplicate binding, an alias cycle, dead
# code, a comma expression. These fail the run, which is how CI holds them
# (`.github/workflows/ci.yml`). `PropertyOverride` is here because it caught a
# real one: `Engine.palette` shadowed `QQuickItem.palette`, and only a Qt 6
# qmllint saw it.
#
# **Warnings, shown and not fatal.** Everything left at its default level needs
# the shell's types to mean anything. With `qs.Commons` unresolvable, `Style`
# reads as an unqualified access in every file, every property on a shell
# widget is missing, and the layout warnings are about widgets whose sizes the
# shell decides. Holding the tree to those would mean holding it to a type
# graph that is not there.
#
# `UnqualifiedAccess` is the one worth arguing about: it is what asks a
# delegate for `pragma ComponentBehavior: Bound`, which Mark.qml now carries.
# Making it fatal needs a resolvable type graph, and handing qmllint the real
# shell modules is not enough for one. Measured on 22 September 2026 with
# `-I` pointing at an Omarchy checkout's `shell/`: 194 unqualified accesses
# and 167 missing properties remain across plugin/*.qml, because the shell's
# own singletons are QObjects shaped at run time (`Style.font.family` is
# "Member family not found on type QObject") and Quickshell's types are not
# there at all. So this category stays a warning, and a delegate that reads an
# outer id is caught by a person reading the lint output, or by the harness.
#
# **Disabled.** The three categories that only say the modules are missing.
# They are noise here, and they count towards the run's warning budget, so
# they are off rather than shown.
#
# What none of this sees is layout and an edit that goes missing. That is
# plugin/harness (docs/UI.md, "Seeing it without a shell").
#
#   /usr/lib/qt6/bin/qmllint plugin/*.qml    # qt6-declarative; /usr/bin/qmllint is Qt 5

[General]
DisableDefaultImports=false
# -1: a warning does not fail the run on count alone. The categories at
# `error` below fail it on their own, whatever the count.
MaxWarnings=-1

[Warnings]
# Only because the shell's modules are absent.
ImportFailure=disable
UnresolvedType=disable
BadSignalHandlerParameters=disable

# Findings the missing modules cannot explain.
AliasCycle=error
AssignmentInCondition=error
Comma=error
ComponentChildrenCount=error
ConfusingExpressionStatement=error
ConfusingMinuses=error
ConfusingPluses=error
ContextProperties=error
DuplicateEnumEntries=error
DuplicateImport=error
DuplicateInlineComponent=error
DuplicatePropertyBinding=error
DuplicatedName=error
EnumsAreNotTypes=error
Eval=error
InheritanceCycle=error
InvalidLintDirective=error
LiteralConstructor=error
NonRootEnum=error
PropertyOverride=error
TopLevelComponent=error
UnintentionalEmptyBlock=error
UnreachableCode=error
UnterminatedCase=error
VarUsedBeforeDeclaration=error
WithStatement=error
