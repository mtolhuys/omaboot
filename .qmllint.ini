# What qmllint can judge outside the shell, and what it cannot.
#
# The window's types come from omarchy-shell (`qs.Commons`, `qs.Ui`) and from
# Quickshell. Neither is installed where this lint usually runs: CI is an Arch
# container with qt6-declarative and nothing else, and a checkout on a machine
# without the shell is the same. So most of what qmllint would say about types
# is an artefact of the missing modules: `Style` reads as an unqualified
# access, every import fails, and the signal handlers of Quickshell's Process
# have parameters of an unknown type. The three categories below are the ones
# that say so in as many words, and they are lowered to info.
#
# What is left is the syntax check, which fails the run on its own (exit 255),
# and that is what CI asks of qmllint. Warnings are shown and counted, not
# fatal: a tree whose types cannot be resolved cannot be held to them.
# Layout, and an edit that goes missing, are the harness's job
# (docs/UI.md, "Seeing it without a shell").
#
#   /usr/lib/qt6/bin/qmllint plugin/*.qml     # qt6-declarative; /usr/bin/qmllint is Qt 5

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
ImportFailure=info
UnresolvedType=info
BadSignalHandlerParameters=info
