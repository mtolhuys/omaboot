[workspace]
resolver = "3"
members = ["crates/omaboot", "crates/omaboot-apply"]
# `cargo run` at the workspace root starts the interface; the helper is
# never something to run by hand.
default-members = ["crates/omaboot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mtolhuys/omaboot"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
